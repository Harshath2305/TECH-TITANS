    <script>
      (function() {
        function isBenignWsError(err) {
          if (!err) return false;
          var msg = typeof err === 'string' ? err : (err.message || err.reason || String(err));
          return (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1
          );
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isBenignWsError(event && event.reason)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isBenignWsError(event && (event.message || event.error))) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
